apiVersion: v1
kind: Service
metadata:
  name: my-app-service
spec:
  type: NodePort
  selector:
    app: my-app        # send traffic to Pods with this label
  ports:
    - port: 80         # port of the Service
      targetPort: 3000 # port the app listens on
      nodePort: 30080  # port opened on every node
