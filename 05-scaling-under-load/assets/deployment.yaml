# Desired state: "I want 1 copy of my-app running, always."
apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: my-app
  template:
    metadata:
      labels:
        app: my-app
    spec:
      containers:
        - name: my-app
          image: ghcr.io/codeinnerpeace/my-app:1.0
          ports:
            - containerPort: 3000
