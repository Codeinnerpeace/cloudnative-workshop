# Desired state: "I want 1 copy/copies of my-app running, always."
apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: my-app
  template:
    metadata:
      labels:
        app: my-app
    spec:
      containers:
        - name: my-app
          # traefik/whoami is a tiny public web server that prints the
          # name of the Pod that served the request. Perfect for demos!
          image: traefik/whoami:v1.10.1
          ports:
            - containerPort: 80
          # Kubernetes restarts the container if this check keeps failing
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          # Kubernetes only sends traffic once this check passes
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 1
            periodSeconds: 3
